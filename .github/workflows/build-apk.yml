name: Build Leo APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Leo ZIP
        shell: bash
        run: |
          mkdir -p build-src

          unzip -q "Leo-v3.3.1-Android-FIXED.zip" -d build-src

          echo "Leo ZIP extracted successfully."

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Build Leo debug APK
        shell: bash
        working-directory: build-src
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload Leo APK
        uses: actions/upload-artifact@v4
        with:
          name: Leo-APK
          path: build-src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
