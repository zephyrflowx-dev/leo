name: Build Leo APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Leo ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Prepare source
        shell: bash
        run: |
          set -e

          rm -rf build-src outer-src
          mkdir -p build-src outer-src

          unzip -q "$ZIP_FILE" -d outer-src

          SETTINGS=$(find outer-src -name "settings.gradle.kts" -print -quit)

          if [ -n "$SETTINGS" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS")
            cp -a "$PROJECT_DIR"/. build-src/
          else
            INNER_ZIP=$(find outer-src -type f -iname "leo-source.zip" -print -quit)

            if [ -z "$INNER_ZIP" ]; then
              INNER_ZIP=$(find outer-src -type f -iname "*.zip" -print -quit)
            fi

            if [ -z "$INNER_ZIP" ]; then
              echo "ERROR: Android source ZIP not found."
              find outer-src -type f
              exit 1
            fi

            echo "Found inner ZIP: $INNER_ZIP"
            unzip -q "$INNER_ZIP" -d build-src
          fi

          SETTINGS=$(find build-src -name "settings.gradle.kts" -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle.kts not found."
            find build-src -maxdepth 4 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Check Leo project
        shell: bash
        run: |
          set -e

          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          echo "Leo Android project looks valid."

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.7"

      - name: Build Leo APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          gradle :app:assembleDebug --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/app-debug.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: Leo APK was not created."
            find "$PROJECT_DIR/app/build" -type f 2>/dev/null || true
            exit 1
          fi

          cp "$APK" Leo.apk

          test -s Leo.apk

          echo "Leo APK successfully created:"
          ls -lh Leo.apk

      - name: Upload Leo APK
        uses: actions/upload-artifact@v4
        with:
          name: Leo-v5.0-APK
          path: Leo.apk
          if-no-files-found: error
