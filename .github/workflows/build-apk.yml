name: Build Leo APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"
          echo "Found: $ZIP_FILE"

      - name: Extract outer ZIP
        run: |
          rm -rf outer-src
          mkdir outer-src
          unzip -q "$ZIP_FILE" -d outer-src

      - name: Find inner Leo ZIP
        run: |
          INNER_ZIP=$(find outer-src -type f -name "leo-source.zip" | head -n 1)

          if [ -z "$INNER_ZIP" ]; then
            echo "ERROR: leo-source.zip not found"
            find outer-src -type f -name "*.zip"
            exit 1
          fi

          echo "INNER_ZIP=$INNER_ZIP" >> "$GITHUB_ENV"
          echo "Found: $INNER_ZIP"

      - name: Extract Leo source
        run: |
          rm -rf build-src
          mkdir build-src
          unzip -q "$INNER_ZIP" -d build-src

      - name: Find Android project
        run: |
          PROJECT_DIR=$(find build-src -name "settings.gradle.kts" -print -quit | xargs dirname)
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.7"

      - name: Build Leo
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle :app:assembleDebug --no-daemon

      - name: Create Leo.apk
        run: |
          APK=$(find "$PROJECT_DIR" -name "app-debug.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created"
            exit 1
          fi

          cp "$APK" Leo.apk
          ls -lh Leo.apk

      - name: Upload Leo APK
        uses: actions/upload-artifact@v4
        with:
          name: Leo-APK
          path: Leo.apk
