name: Build Leo APK

on:
  workflow_dispatch:
  push:
    paths:
      - "leo-source.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Extract Leo source ZIP
        run: |
          rm -rf build-src
          mkdir -p build-src
          unzip -q leo-source.zip -d build-src

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.7"

      - name: Build Leo APK
        working-directory: build-src
        run: |
          gradle :app:assembleDebug --no-daemon

      - name: Prepare Leo.apk
        run: |
          cp build-src/app/build/outputs/apk/debug/app-debug.apk Leo.apk

      - name: Upload Leo APK
        uses: actions/upload-artifact@v4
        with:
          name: Leo-APK
          path: Leo.apk
