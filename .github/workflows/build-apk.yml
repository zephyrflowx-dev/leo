name: Build Leo APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build
        run: |
          if [ -f leo-app.zip ]; then mkdir -p build-src && unzip -oq leo-app.zip -d build-src && cd build-src; fi
          gradle assembleDebug --stacktrace
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/out/Leo.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Leo-APK
          path: out/Leo.apk
