name: Build Leo APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find uploaded Leo ZIP
        shell: bash
        run: |
          set -e

          echo "Files in repository:"
          find . -maxdepth 3 -type f -print

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract repository ZIP
        shell: bash
        run: |
          set -e

          rm -rf outer-src
          mkdir -p outer-src

          unzip -q "$ZIP_FILE" -d outer-src

          echo "Outer ZIP contents:"
          find outer-src -maxdepth 4 -type f -print

      - name: Find Leo source ZIP
        shell: bash
        run: |
          set -e

          INNER_ZIP=$(find outer-src -type f -iname "leo-source.zip" | head -n 1)

          if [ -z "$INNER_ZIP" ]; then
            echo "leo-source.zip was not found."
            echo "ZIP files found:"
            find outer-src -type f -iname "*.zip" -print
            exit 1
          fi

          echo "Found Leo source: $INNER_ZIP"
          echo "INNER
