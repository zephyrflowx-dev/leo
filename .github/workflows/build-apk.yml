name: Build Leo APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.3.4 --activate
          pnpm --version
          node --version

      - name: Extract Leo project
        shell: bash
        run: |
          ZIP_FILE="$(find . -maxdepth 2 -type f -name 'Leo-v5.0-Standalone-Android.zip' | head -1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Leo-v5.0-Standalone-Android.zip not found."
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "ZIP extracted successfully."
          find extracted -maxdepth 3 -type f | sort | head -300

      - name: Find Leo project
        shell: bash
        run: |
          PACKAGE="$(find extracted -type f -name package.json | head -1)"

          if [ -z "$PACKAGE" ]; then
            echo "ERROR: package.json was not found inside the ZIP."
            find extracted -type f | sort
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PACKAGE")"

          echo "Leo project directory:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          pnpm install --no-frozen-lockfile --allow-build=esbuild

      - name: Create environment
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          printf 'GROQ_API_KEY=%s\n' "$GROQ_API_KEY" > .env.production
          printf 'GOOGLE_GENERATIVE_AI_API_KEY=%s\n' "$GEMINI_API_KEY" >> .env.production

      - name: Build Leo web app
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          pnpm build

      - name: Add Capacitor Android
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          pnpm exec cap add android

      - name: Sync Capacitor
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          pnpm exec cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build Leo APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Leo APK
        uses: actions/upload-artifact@v4
        with:
          name: Leo-v5.0-debug
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
        
