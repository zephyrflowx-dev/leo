name: Build Leo APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. Setup Node.js
      # --------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22


      # --------------------------------------------------
      # 3. Setup pnpm
      # --------------------------------------------------
      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.3.4 --activate
          pnpm --version
          node --version


      # --------------------------------------------------
      # 4. Find and extract Leo ZIP
      # --------------------------------------------------
      - name: Extract Leo project
        shell: bash
        run: |
          echo "Searching for Leo ZIP..."

          ZIP_FILE="$(find . -maxdepth 3 -type f -name 'Leo-v5.0-Standalone-Android.zip' | head -1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Leo-v5.0-Standalone-Android.zip was not found."
            echo ""
            echo "Files currently in repository:"
            find . -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "Found ZIP:"
          echo "$ZIP_FILE"

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo ""
          echo "Leo ZIP extracted successfully."
          echo ""
          echo "Extracted files:"
          find extracted -maxdepth 4 -type f | sort | head -300


      # --------------------------------------------------
      # 5. Find actual project directory
      # --------------------------------------------------
      - name: Find Leo project
        shell: bash
        run: |
          echo "Searching for package.json..."

          PACKAGE_FILE="$(find extracted -type f -name 'package.json' | head -1)"

          if [ -z "$PACKAGE_FILE" ]; then
            echo "ERROR: package.json was not found inside the ZIP."
            echo ""
            find extracted -type f | sort
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PACKAGE_FILE")"

          echo ""
          echo "Leo project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # --------------------------------------------------
      # 6. Configure pnpm build permissions
      # --------------------------------------------------
      - name: Configure pnpm
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          cat > pnpm-workspace.yaml <<'EOF'
          allowBuilds:
            esbuild: true
          EOF

          echo "Created pnpm-workspace.yaml:"
          cat pnpm-workspace.yaml


      # --------------------------------------------------
      # 7. Install dependencies
      # --------------------------------------------------
      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          pnpm install --no-frozen-lockfile


      # --------------------------------------------------
      # 8. Create environment
      # --------------------------------------------------
      - name: Create environment
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          printf 'GROQ_API_KEY=%s\n' "$GROQ_API_KEY" > .env.production
          printf 'GOOGLE_GENERATIVE_AI_API_KEY=%s\n' "$GEMINI_API_KEY" >> .env.production

          echo "Environment file created."


      # --------------------------------------------------
      # 9. Build Leo web application
      # --------------------------------------------------
      - name: Build Leo web app
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          pnpm build


      # --------------------------------------------------
      # 10. Add Capacitor Android
      # --------------------------------------------------
      - name: Add Capacitor Android
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          if [ -d "android" ]; then
            echo "Android project already exists."
          else
            pnpm exec cap add android
          fi


      # --------------------------------------------------
      # 11. Sync Capacitor
      # --------------------------------------------------
      - name: Sync Capacitor
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          pnpm exec cap sync android


      # --------------------------------------------------
      # 12. Setup Java
      # --------------------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'


      # --------------------------------------------------
      # 13. Build Android APK
      # --------------------------------------------------
      - name: Build Leo APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace


      # --------------------------------------------------
      # 14. Check APK
      # --------------------------------------------------
      - name: Check APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          echo "Searching for APK..."

          APK="$(find android/app/build/outputs/apk/debug -type f -name '*.apk' | head -1)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo ""
          echo "======================================"
          echo "LEO APK CREATED SUCCESSFULLY"
          echo "======================================"
          echo "$APK"
          ls -lh "$APK"


      # --------------------------------------------------
      # 15. Upload APK
      # --------------------------------------------------
      - name: Upload Leo APK
        uses: actions/upload-artifact@v4
        with:
          name: Leo-v5.0-debug
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
                  
